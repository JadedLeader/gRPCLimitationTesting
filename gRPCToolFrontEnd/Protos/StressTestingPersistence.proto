syntax = "proto3";

option csharp_namespace = "gRPCToolFrontEnd";

service StressTestingPersistence
{ 
   rpc SaveSession(stream SaveSessionPointRequest) returns (SaveSessionPointResponse);
   rpc StreamSessionRuns(StreamSessionRunRequest) returns (stream StreamSessionRunResponse);
   rpc StreamLatencyMeasurements(StreamLatencyMeasurementsRequest) returns (stream StreamLatencyMeasurementsResponse);
   rpc StreamMultipleLatencies(StreamSessionRunIdsRequest) returns (stream StreamSessionRunIdsResponse);
}

message SaveSessionPointRequest
{
  string sessionUnique = 1;
  string presetName= 2;
  TestType testType = 3;
  double latencyValue = 4;
  StressLevel stressLevel = 5;
  ClientType clientType = 6;
  string OverarchingPresetName = 7;
}

message SaveSessionPointResponse
{
  bool success = 1;
  string message =2;
}


message StreamSessionRunRequest
{
  string sessionUnique = 1;
}

message StreamSessionRunResponse
{
  string presetName = 1;
  string sessionRunId = 2;
  bool success = 3;
  string message = 4;
  string overarchingPresetName = 5;
}

message StreamLatencyMeasurementsRequest
{
  string sessionUnique = 1;
  string sessionRunUnique = 2;
}

message StreamLatencyMeasurementsResponse
{
  string TestType = 1;
  double Latency = 2;
  bool success = 3;
  string message = 4;
}

message StreamSessionRunIdsRequest
{
  string OverarchingPresetName = 1;
}

message StreamSessionRunIdsResponse
{
  string TestType = 1;
  double Latency = 2;
  string ClientType = 3;
  string StressLevel = 4;
}

enum TestType
{ 
  UnarySingle = 0; 
  UnaryBatch = 1; 
  StreamingSingle = 2; 
  StreamingBatch = 3;
}

enum StressLevel
{ 
  Low = 0; 
  Medium = 1; 
  High = 2;
}

enum ClientType
{ 
  SingleClient = 0; 
  MultiClient = 1;
}